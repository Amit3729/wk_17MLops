[project]
name = "track-b-agentic"
version = "0.3.0"
description = "Track B: MLOps for the W15/W16 agentic RAG assistant (uv, MLflow, Evidently, Airflow)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # API
    "fastapi>=0.129,<0.137",  # apache-airflow-core 3.3 caps fastapi<0.137; one lock covers every group
    "uvicorn[standard]==0.53.0",
    "pydantic-settings==2.15.0",
    "python-dotenv>=1.0",
    # Model providers (OpenAI-compatible: OpenAI, vLLM, Ollama)
    "openai==3.14.1",
    "httpx==0.28.1",
    # RAG
    "beautifulsoup4==4.15.0",
    "chromadb==1.5.9",
    "fastembed==0.7.4",
    "numpy==2.4.6",
    # UI
    "streamlit==1.64.0",
    "requests==2.34.2",
    # MLOps (W17)
    "mlflow",
    "evidently[llm]",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]
# Optional orchestration layer. Not installed by `uv sync`; opt in with
# `uv sync --group airflow`.
airflow = [
    "apache-airflow>=3.3",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
