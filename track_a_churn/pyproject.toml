[project]
name = "telco-churn-mlops"
version = "0.1.0"
description = "Track A: MLOps (uv + MLflow + Evidently + Airflow) for the IBM Telco Customer Churn model"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "evidently>=0.7.23",
    "fastapi>=0.129,<0.137",  # upper bound set by apache-airflow-core 3.3 (optional airflow group)
    "matplotlib>=3.11.2",
    "mlflow>=3.16.1",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
churn-train = "churn.train:main"
churn-register = "churn.register:main"
churn-compare = "churn.compare:main"
churn-drift = "churn.drift:main"
churn-serve = "churn.serve:main"
churn-pipeline = "churn.pipeline:main"

[dependency-groups]
airflow = [
    "apache-airflow>=3.3",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
